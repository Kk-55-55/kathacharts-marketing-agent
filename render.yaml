services:
  - type: web
    name: kathacharts-marketing-agent
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: KATHACHARTS_URL
        value: https://kathacharts.com
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: HUNT_INTERVAL_MINUTES
        value: "30"
      - key: AGENT_ADMIN_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
